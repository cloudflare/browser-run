name = "puppeteer-test-workers"
main = "src/server/index.ts"
workers_dev = false
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2026-04-04"
upload_source_maps = true

routes = [
  { pattern = "puppeteer-test-workers.rendering.cfdata.org", custom_domain = true },
]

[browser]
binding = "BROWSER"
remote = true

# Browser Run sends the test server hostnames to this Worker through the
# `outboundByHost` map of the session.
[[services]]
binding = "SELF"
service = "puppeteer-test-workers"

[assets]
directory = "../../../submodules/puppeteer/test/assets"
binding = "ASSETS"
run_worker_first = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[[durable_objects.bindings]]
name = "TESTS_SERVER"
class_name = "TestsServer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TestsServer"]
