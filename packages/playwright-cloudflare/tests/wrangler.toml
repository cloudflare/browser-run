name = "playwright-test-workers"
main = "src/server/index.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2026-04-04"
upload_source_maps = true

base_dir = "../../../submodules/playwright/tests"
find_additional_modules = true

rules = [
  { type = "Data", globs = ["assets/**/*", "config/testserver/*", "**/*-snapshots/**/*-chromium.*"], fallthrough = true }
]

routes = [
  { pattern = "playwright-test-workers.rendering.cfdata.org", custom_domain = true },
  { pattern = "playwright-test-workers-cross-origin.rendering.cfdata.org", custom_domain = true },
]

[browser]
binding = "BROWSER"

# Browser Run sends the test server hostnames to this Worker through the
# `outboundByHost` map of the session.
[[services]]
binding = "SELF"
service = "playwright-test-workers"

[assets]
directory = "../../../submodules/playwright/tests/assets"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[[durable_objects.bindings]]
name = "TESTS_SERVER"
class_name = "TestsServer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TestsServer"]
