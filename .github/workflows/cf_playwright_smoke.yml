name: "Playwright for Cloudflare - Smoke Tests"
permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: cf-playwright-worker-deployment
  cancel-in-progress: false

jobs:
  test_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare package
        run: |
          npm ci
          git submodule update --init
          cd packages/playwright-cloudflare
          npm run build
          npm run test:runner:build
          npm run test:runner:check

      - name: Deploy the runner Worker
        working-directory: packages/playwright-cloudflare/tests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # A new token for every run, deployed in the same version as the
        # build, so no version serves this build with an older token.
        # runner/run.mjs waits until the Worker serves this build.
        run: |
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          echo "RUN_TOKEN=$token" >> "$GITHUB_ENV"
          printf 'RUN_TOKEN=%s\n' "$token" > "$RUNNER_TEMP/runner.secrets"
          npx wrangler deploy -c wrangler.runner.toml --secrets-file "$RUNNER_TEMP/runner.secrets"
          rm "$RUNNER_TEMP/runner.secrets"

      - name: Type-check Cloudflare CDP types
        run: |
          cd packages/playwright-cloudflare/tests
          npm run test-types

      - name: Run Smoke Tests
        working-directory: packages/playwright-cloudflare
        env:
          RUNNER_URL: https://playwright-test-runner.rendering.cfdata.org
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
        run: |
          npm run test:runner -- --project=suite --grep "@smoke" --reporter=html

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report--attempt-${{ github.run_attempt }}
          path: packages/playwright-cloudflare/tests/playwright-report/
          retention-days: 30
